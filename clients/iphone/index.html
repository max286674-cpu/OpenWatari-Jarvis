<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Watari</title>
<style>
  :root { --bg:#0b0f14; --fg:#e6edf3; --mut:#7d8590; --accent:#58a6ff; --you:#1f6feb22; --j:#23863633; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body { display:flex; flex-direction:column; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { padding:12px 16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid #21262d; }
  header h1 { font-size:17px; margin:0; font-weight:600; letter-spacing:.3px; }
  #dot { width:10px; height:10px; border-radius:50%; background:#f85149; transition:background .2s; }
  #dot.on { background:#3fb950; } #dot.busy { background:#d29922; }
  #status { margin-left:auto; color:var(--mut); font-size:12px; }
  #log { flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:8px; }
  .msg { padding:9px 12px; border-radius:14px; max-width:85%; white-space:pre-wrap; word-wrap:break-word; }
  .you { align-self:flex-end; background:var(--you); border:1px solid #1f6feb55; }
  .j   { align-self:flex-start; background:var(--j); border:1px solid #2386364d; }
  .sys { align-self:center; color:var(--mut); font-size:12px; background:none; }
  footer { padding:10px 12px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid #21262d; }
  .row { display:flex; gap:8px; align-items:center; }
  input[type=text] { flex:1; background:#0d1117; border:1px solid #30363d; color:var(--fg);
    border-radius:10px; padding:11px 12px; font-size:16px; }
  button { background:#21262d; color:var(--fg); border:1px solid #30363d; border-radius:10px;
    padding:11px 14px; font-size:15px; font-weight:600; }
  button:active { transform:scale(.97); }
  #mic { background:var(--accent); color:#04101f; border:none; min-width:64px; }
  #mic.rec { background:#f85149; color:#fff; }
  .cfg { display:flex; gap:8px; align-items:center; padding:8px 16px; border-bottom:1px solid #21262d;
    font-size:13px; color:var(--mut); flex-wrap:wrap; }
  .cfg input[type=text] { flex:1; min-width:160px; padding:7px 9px; font-size:13px; }
  .cfg label { display:flex; gap:5px; align-items:center; }
  details { padding:0; } summary { list-style:none; cursor:pointer; }
</style>
</head>
<body>
  <header>
    <span id="dot"></span>
    <h1>Watari</h1>
    <span id="status">disconnected</span>
  </header>

  <details>
    <summary class="cfg"><span>⚙︎ connection</span></summary>
    <div class="cfg">
      <input id="url" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" />
      <input id="token" type="text" placeholder="auth token (auto-filled)" autocapitalize="off" autocorrect="off" spellcheck="false" />
      <label><input id="hp" type="checkbox" /> AirPods on this phone</label>
      <label><input id="wake" type="checkbox" checked /> require "Watari"</label>
      <button id="connect">Connect</button>
      <button id="disconnect">Disconnect</button>
    </div>
  </details>

  <div id="log"></div>

  <footer>
    <div class="row">
      <input id="text" type="text" placeholder="Type a message…" enterkeyhint="send" />
      <button id="mic" title="Tap to mute / unmute the mic">🎙</button>
    </div>
  </footer>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const log = $("log"), dot = $("dot"), statusEl = $("status");
  const sid = "iphone-" + Math.random().toString(36).slice(2, 9);

  // Default WS url = same host that served this page, brain port 8765, path /voice.
  const defaultUrl = `ws://${location.hostname || "127.0.0.1"}:8765/voice`;
  $("url").value = localStorage.getItem("jarvisUrl") || defaultUrl;
  $("hp").checked = localStorage.getItem("jarvisHp") === "1";
  // Auth token: injected by the brain when it serves this page (window.JARVIS_TOKEN), else a saved
  // one. Browsers can't set a WS Authorization header, so we pass it as ?token= on the URL instead.
  const token = (window.JARVIS_TOKEN || localStorage.getItem("jarvisToken") || "").trim();
  if ($("token")) $("token").value = token;

  // Wake words that "address" Watari when the mic is always-on (mirrors the laptop's wake gate).
  // Browser speech-recognition transcribes the spoken name, so his real name works here even
  // though the laptop's openWakeWord trigger is still acoustically "hey jarvis".
  const WAKE = ["watari", "hey watari", "hey jarvis", "jarvis"];

  let ws = null, speaking = false, jBuf = null;
  let wantListen = false;      // user intends the mic to stay open (continuous listening)
  let pendingSpeak = 0;        // outstanding TTS utterances — we pause the mic while speaking
  let turnVoice = false;       // was THIS turn spoken? voice in -> voice out; text in -> text out
  let wakeLock = null;

  function add(text, cls) {
    const el = document.createElement("div");
    el.className = "msg " + cls; el.textContent = text;
    log.appendChild(el); log.scrollTop = log.scrollHeight;
    return el;
  }
  function setState(s) {
    statusEl.textContent = s;
    dot.className = (s === "connected" || s === "ready" || s === "listening") ? "on"
      : (s === "thinking" || s === "speaking") ? "busy" : "";
  }
  const restState = () => setState(wantListen && ws && ws.readyState === 1 ? "listening" : "ready");

  // ---- keep the screen awake so the mic keeps listening while the app is open ----
  async function keepAwake() {
    try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch {}
  }
  function dropAwake() { try { wakeLock && wakeLock.release(); } catch {} wakeLock = null; }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && wantListen) { keepAwake(); startRec(); }
  });

  // ---- text-to-speech (plays through whatever the phone outputs to — AirPods if connected) ----
  function speak(text) {
    if (!("speechSynthesis" in window) || !text.trim()) return;
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.05;
    u.onstart = () => { speaking = true; pendingSpeak++; stopRec(); };  // mute mic while he talks
    u.onend = () => { pendingSpeak = Math.max(0, pendingSpeak - 1);
      if (pendingSpeak === 0) { speaking = false; if (wantListen) startRec(); } };
    speechSynthesis.speak(u);
  }
  function stopSpeaking() {
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    speaking = false; pendingSpeak = 0;
  }

  // ---- WebSocket to the brain ----
  function connect() {
    const url = $("url").value.trim();
    const tok = ($("token") ? $("token").value.trim() : token);
    localStorage.setItem("jarvisUrl", url);
    localStorage.setItem("jarvisToken", tok);
    localStorage.setItem("jarvisHp", $("hp").checked ? "1" : "0");
    // Browsers can't send an Authorization header on a WS, so pass the token as a query param.
    const wsUrl = tok ? url + (url.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(tok) : url;
    try { ws && ws.close(); } catch {}
    setState("connecting…");
    ws = new WebSocket(wsUrl);
    ws.onopen = () => {
      setState("connected");
      send({ type:"hello", session_id:sid, device_id:"iphone",
             headphones_connected: $("hp").checked });
      // iOS only lets the mic start from a real tap, so we DON'T auto-start. Prompt for one tap;
      // after that the mic stays on continuously (re-armed on every onend).
      if (SR) { micUi(); add("Connected. Tap the 🎙 button to start listening.", "sys"); }
    };
    ws.onclose = () => { setState("disconnected"); };
    ws.onerror = () => setState("error");
    ws.onmessage = (e) => onEvent(JSON.parse(e.data));
  }
  function disconnect() {
    wantListen = false; stopRec(); stopSpeaking(); dropAwake(); micUi();
    try { ws && ws.close(); } catch {}
    setState("disconnected");
    add("Disconnected. Tap Connect to resume.", "sys");
  }
  function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

  function onEvent(ev) {
    if (ev.type !== "stream") return;
    if (ev.kind === "lifecycle") {
      if (ev.delta === "ready") restState();
      else if (ev.delta === "thinking") { setState("thinking"); jBuf = null; }
      else if (ev.delta === "cancelled") { stopSpeaking(); restState(); }
      else if (ev.delta === "error") { add("(error handling that)", "sys"); restState(); }
      return;
    }
    if (ev.kind === "tool") { add(ev.delta, "sys"); return; }   // spoken progress filler
    if (ev.kind === "assistant") {
      if (!jBuf) jBuf = add("", "j");
      jBuf.textContent += ev.delta;
      log.scrollTop = log.scrollHeight;
      if (turnVoice) { setState("speaking"); speak(ev.delta); }  // voice in -> voice out; else text only
      if (ev.final) { jBuf = null; if (!turnVoice) restState(); }
    }
  }

  // voice=true means this turn came from the mic, so the reply should be spoken back.
  function sendUtterance(text, voice) {
    text = (text || "").trim(); if (!text) return;
    turnVoice = !!voice;
    if (speaking) { stopSpeaking(); send({ type:"barge", session_id:sid }); }
    add(text, "you");
    send({ type:"utterance", session_id:sid, text, device_id:"iphone",
           speaker_verified:false, ts_user_stop_ms: Date.now() });
  }

  // Strip a leading wake word; return the command, or null if none present (ambient -> ignore).
  function gateWake(raw) {
    if (!$("wake").checked) return raw;            // open-mic mode: send everything
    const t = raw.trim().toLowerCase();
    for (const w of WAKE) {
      const i = t.indexOf(w);
      if (i !== -1) {
        const rest = raw.trim().slice(i + w.length).replace(/^[\s,.:!?]+/, "");
        return rest || "(no command)";             // said just "Watari" -> let the brain prompt back
      }
    }
    return null;
  }

  // ---- text input (typed -> typed reply) ----
  $("text").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { sendUtterance($("text").value, false); $("text").value = ""; }
  });
  $("connect").addEventListener("click", connect);
  $("disconnect").addEventListener("click", disconnect);

  // ---- continuous always-on mic via Web Speech API (foreground only on iOS) ----
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = $("mic");
  let rec = null, recActive = false;
  function micUi() {
    if (!SR) return;
    mic.classList.toggle("rec", wantListen);
    mic.title = wantListen ? "Listening — tap to mute" : "Muted — tap to listen";
  }
  function startRec() {
    if (!SR || !wantListen || recActive || speaking) return;
    try { rec.start(); recActive = true; } catch {}
  }
  function stopRec() { if (rec && recActive) { try { rec.stop(); } catch {} recActive = false; } }

  if (SR) {
    rec = new SR();
    rec.lang = "en-US"; rec.interimResults = false; rec.maxAlternatives = 1; rec.continuous = true;
    rec.onresult = (e) => {
      const said = e.results[e.results.length - 1][0].transcript;
      const cmd = gateWake(said);
      if (cmd !== null) sendUtterance(cmd, true);   // directed speech -> voice reply
    };
    // iOS ends recognition often; re-arm it so the mic stays effectively always-on.
    rec.onend = () => { recActive = false; if (wantListen && !speaking) setTimeout(startRec, 250); };
    rec.onerror = (e) => { recActive = false;
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        wantListen = false; micUi(); add("Mic permission denied — enable it in Safari settings.", "sys");
      } };
    mic.addEventListener("click", () => {     // toggle listening on/off
      wantListen = !wantListen; micUi();
      if (wantListen) { keepAwake(); startRec(); } else { stopRec(); }
    });
  } else {
    // No voice support in this browser (e.g. an in-app browser, or not Safari on iOS): hide the
    // button entirely — the user just taps the text field to type.
    mic.style.display = "none";
    add("Voice isn't available in this browser — open this page in Safari to use the mic.", "sys");
  }

  connect();  // auto-connect on load
})();
</script>
</body>
</html>
