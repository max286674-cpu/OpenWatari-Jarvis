[project]
name = "jarvis"
version = "0.0.1"
description = "OpenWatari — an open-source framework for building your own 24/7, voice-first, multi-device AI companion (Watari)"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["voice-assistant", "pipecat", "speech", "tts", "stt", "wake-word", "llm-agent", "self-hosted"]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "rich>=13.0",
]

[project.scripts]
jarvis-setup = "jarvis.setup_wizard:main"

[project.optional-dependencies]
edge = [
    "pipecat-ai[silero,webrtc]>=0.0.90",
    "pyaudio>=0.2.11",
    "textual>=0.79",
]
cloud-voice = [
    "pipecat-ai[elevenlabs,deepgram]>=0.0.90",
]
local-voice = [
    "openwakeword>=0.6",
    "pipecat-ai[whisper,piper]>=0.0.90",
    "kokoro-onnx>=0.4",
    "useful-moonshine-onnx>=2025.11",
    "pygame>=2.6",
]
brain = [
    "openai>=1.40",
    "tzdata>=2024.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "sqlalchemy>=2.0",
    "yt-dlp>=2024.8",
    "ytmusicapi>=1.7",
    "redis>=5.0",
]
channels = [
    "telethon>=1.36",
    "py-tgcalls>=2.3",
]
browse = [
    "playwright>=1.47",
]
office = [
    "python-docx>=1.1",
    "openpyxl>=3.1",
]
desktop = [
    "pyautogui>=0.9.54",
]
identity = [
    "pyaudio>=0.2.11",
    "speechbrain>=1.0",
    "torch>=2.2",
    "torchaudio>=2.2",
    "soxr>=0.3",
]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
